name: Bug Report
description: File a bug report.
labels: ['bug']
type: bug
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: Please provide a clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: version-info
    attributes:
      label: Version Information
      placeholder: Please provide your Solstice version (e.g. 2026.6.0) and your Android or iOS version.
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: To reproduce
      description: Steps to reproduce the behavior. Remember, the more descriptive you are, the easier it is for us to fix the issue!
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
