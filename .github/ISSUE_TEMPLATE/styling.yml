name: Styling or visual issues
description: Things don't look right, illegible text, misaligned elements, etc.
labels: ['styling']
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the problem
      description: Where exactly does this issue happen? What makes it problematic for you? Screenshots are very helpful!
    validations:
      required: true
  - type: textarea
    id: version-info
    attributes:
      label: Version Information
      placeholder: Please provide your Solstice version (e.g. 2026.6.0) and your Android or iOS version.
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
