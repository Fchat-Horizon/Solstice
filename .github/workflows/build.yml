name: Build & Create Draft Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v[0-9]*'

jobs:
  build-and-release:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Extract Release Version from Tag
        id: get_version
        run: |
          version="${GITHUB_REF#refs/tags/}"
          echo "release_version=${version}" >> $GITHUB_OUTPUT

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build web assets
        run: pnpm --filter solstice-mobile build:dist

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > $GITHUB_WORKSPACE/release.keystore

      - name: Build release APKs
        working-directory: mobile/android
        env:
          STORE_FILE: ${{ github.workspace }}/release.keystore
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$STORE_FILE" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Collect and rename APKs
        env:
          RELEASE_VERSION: ${{ steps.get_version.outputs.release_version }}
        run: |
          mkdir -p release_artifacts
          for apk in mobile/android/app/build/outputs/apk/*/release/*.apk; do
            flavor=$(echo "$apk" | grep -oP '(?<=apk/)\w+(?=/release)')
            cp "$apk" "release_artifacts/solstice-${RELEASE_VERSION}-${flavor}.apk"
          done

      - name: Generate SHA256 Checksums
        run: |
          cd release_artifacts
          find . -type f -not -name "SHASUMS256.txt" -exec sha256sum {} \; | sort > SHASUMS256.txt

      - name: Detect release type
        id: release_type
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == *"-dev."* ]]; then
            echo "draft=false" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          elif [[ "$TAG" == *"-beta."* ]]; then
            echo "draft=true" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "draft=true" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: ${{ steps.release_type.outputs.draft }}
          prerelease: ${{ steps.release_type.outputs.prerelease }}
          files: release_artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
