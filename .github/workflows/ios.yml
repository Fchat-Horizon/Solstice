name: Build iOS (SideStore)

# iOS can only be compiled on macOS, so this runs on a macOS runner. It builds the shared
# web bundle, generates the Xcode project from mobile/ios/project.yml with XcodeGen, runs
# the NativeLogs unit tests, ad-hoc signs the app, and produces an unsigned-by-SideStore .ipa.
#
# This builds on a `v*` release tag (a version push), on pull requests that touch the mobile/shared
# code (verification only, no publish), and on manual dispatch. It deliberately does NOT build on
# every push to development, so routine commits don't burn a macOS build.
#
# On a version tag the .ipa is published two ways, one per channel:
#
#   * STABLE (a `v*` tag with no `-dev.`/`-beta.` suffix) -> the .ipa AND a sidestore-source.json are
#     attached to that version's own GitHub release, next to the Android APKs. The public SideStore
#     source URL is `releases/latest/download/sidestore-source.json`, which GitHub resolves to the
#     newest PUBLISHED, non-prerelease release, so the source only moves when a real release goes
#     live (build.yml creates stable releases as drafts for the maintainer to publish).
#   * TEST (every version tag, including `-dev.`) -> the rolling `ios-latest` pre-release, whose
#     stable download URL feeds the test SideStore source. It is marked prerelease + make_latest:false
#     so it never hijacks the "Latest" release.
#
# The release-tag attachment only uploads assets (gh release upload) without touching the release's
# draft state, so the Android release pipeline (build.yml) is unaffected. Every run also archives the
# .ipa as a private workflow artifact.

permissions:
  contents: write

on:
  push:
    tags: ['v[0-9]*']
  pull_request:
    paths:
      - 'mobile/**'
      - 'chat/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  build-ios:
    name: Build unsigned IPA
    runs-on: macos-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # Emits mobile/www, which mobile/ios/project.yml references as a folder reference.
      # Must run BEFORE xcodegen so the folder exists when the project is generated.
      - name: Build web assets
        run: pnpm --filter solstice-mobile build:dist

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Read app version
        id: version
        run: |
          version="$(node -p "require('./mobile/package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # Use a monotonic build number from the run number.
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          # Unique, incrementing version per build (package version + run number). The bare package
          # version is constant across rolling builds, so SideStore never saw a change and offered
          # no update; stamping the run number makes each build newer than the last installed one.
          echo "display=${version}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      # A `-dev.`/`-beta.` tag is a test build; anything else is a real release. Mirrors the same
      # check in build.yml, which drafts stable releases and publishes pre-releases directly.
      - name: Detect release channel
        id: channel
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == *"-dev."* || "$TAG" == *"-beta."* ]]; then STABLE=false; else STABLE=true; fi
          echo "stable=${STABLE}" >> "$GITHUB_OUTPUT"
          echo "Tag ${TAG} -> stable=${STABLE}"

      - name: Generate Xcode project
        working-directory: mobile/ios
        run: xcodegen generate

      - name: Run unit tests (NativeLogs format parity)
        working-directory: mobile/ios
        run: |
          # Pick an available simulator by UDID rather than a hard-coded name, since the
          # runner's installed simulators change between Xcode images. Extract the UUID token
          # (device names like "iPhone SE (3rd generation)" contain parens, so match the UUID).
          uuid='[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}'
          UDID=$(xcrun simctl list devices available | grep iPhone | grep -oE "$uuid" | head -1)
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available | grep -oE "$uuid" | head -1)
          fi
          echo "Using simulator $UDID"
          xcodebuild test \
            -project Solstice.xcodeproj \
            -scheme Solstice \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$UDID" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned device app
        working-directory: mobile/ios
        run: |
          xcodebuild \
            -project Solstice.xcodeproj \
            -scheme Solstice \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            MARKETING_VERSION="${{ steps.version.outputs.display }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package IPA (ad-hoc signed)
        working-directory: mobile/ios
        run: |
          APP="build/Build/Products/Release-iphoneos/Solstice.app"
          test -d "$APP" || { echo "Build product not found at $APP"; exit 1; }
          # Ad-hoc sign so the app has a valid code-signature structure for SideStore/AltStore
          # to replace on-device. A fully-unsigned Mach-O (no LC_CODE_SIGNATURE) can crash the
          # re-signer during install. Ad-hoc (-) needs no certificate/keychain, and the app has
          # no embedded frameworks, so signing the bundle is sufficient.
          codesign --force --sign - --timestamp=none "$APP"
          codesign --verify --verbose "$APP"
          rm -rf Payload Solstice-*.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          IPA="Solstice-${{ steps.version.outputs.version }}.ipa"
          zip -qry "$IPA" Payload
          echo "Built $IPA ($(du -h "$IPA" | cut -f1))"

      # Private distribution: the IPA is published only as a workflow artifact (collaborators
      # only), never attached to a public release. Download it with
      #   gh run download <run-id> -n Solstice-ios-unsigned
      # and import the .ipa into a standalone SideStore (My Apps -> +).
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Solstice-ios-unsigned
          path: mobile/ios/Solstice-*.ipa
          if-no-files-found: error

      # Public one-tap install. The manifest rides along on the version's own release, so the
      # `releases/latest/download/sidestore-source.json` URL always serves the newest PUBLISHED
      # stable release: assets land on the draft release and go live when the maintainer publishes
      # it. downloadURL is pinned to this exact tag so the manifest and the .ipa can never disagree.
      - name: Prepare stable SideStore source
        if: steps.channel.outputs.stable == 'true'
        working-directory: mobile/ios
        run: |
          IPA="Solstice-${{ steps.version.outputs.version }}.ipa"
          URL="${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/${IPA}"
          mkdir -p stable
          node - "${{ steps.version.outputs.version }}" "$(date -u +%Y-%m-%d)" "$(stat -f%z "$IPA")" "$URL" "${{ github.ref_name }}" <<'NODE'
          const fs = require('fs');
          const [version, date, size, url, tag] = process.argv.slice(2);
          const src = JSON.parse(fs.readFileSync('sidestore-source.json', 'utf8'));
          const app = src.apps[0];
          const notes = `Solstice ${tag}. See the GitHub release notes for what changed.`;
          Object.assign(app, { version, versionDate: date, versionDescription: notes,
                               size: Number(size), downloadURL: url });
          app.minOSVersion = '14.0.0';
          app.versions = [{ version, date, localizedDescription: notes,
                            downloadURL: url, size: Number(size), minOSVersion: '14.0.0' }];
          fs.writeFileSync('stable/sidestore-source.json', JSON.stringify(src, null, 2));
          NODE

      # One-tap on-device install: stable-named .ipa + a SideStore source pointing at it.
      # Only on a version push (a `v*` release tag), never on PRs.
      - name: Prepare rolling-release assets
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        working-directory: mobile/ios
        run: |
          cp "Solstice-${{ steps.version.outputs.version }}.ipa" Solstice.ipa
          URL="${{ github.server_url }}/${{ github.repository }}/releases/download/ios-latest/Solstice.ipa"
          node - "${{ steps.version.outputs.display }}" "$(date -u +%Y-%m-%d)" "$(stat -f%z Solstice.ipa)" "$URL" <<'NODE'
          const fs = require('fs');
          const [version, date, size, url] = process.argv.slice(2);
          const src = JSON.parse(fs.readFileSync('sidestore-source.json', 'utf8'));
          const app = src.apps[0];
          // Distinct source name/identifier from the stable channel, so someone who adds both
          // sees two clearly labelled entries instead of a duplicate. The bundle identifier is
          // deliberately NOT changed: it is the same app, and changing it would break updates
          // for everyone already on this channel.
          src.name = 'Solstice (Test)';
          src.identifier = 'net.flist.solstice.source.test';
          app.name = 'Solstice (Test)';
          Object.assign(app, { version, versionDate: date, size: Number(size), downloadURL: url });
          app.minOSVersion = '14.0.0';
          app.versions = [{ version, date, localizedDescription: 'Rolling iOS test build.',
                            downloadURL: url, size: Number(size), minOSVersion: '14.0.0' }];
          fs.writeFileSync('sidestore-source.json', JSON.stringify(src, null, 2));
          NODE

      - name: Publish rolling pre-release (ios-latest)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-latest
          prerelease: true
          make_latest: 'false'
          name: iOS test build (latest)
          body: |
            Rolling, ad-hoc-signed iOS **test** build of the latest `development` commit,
            not an official release. SideStore/LiveContainer re-signs it on-device.

            **Install (one-tap):** open `Solstice.ipa` below on your iPhone and choose
            **Open in LiveContainer** (or your sideloader). Or add `sidestore-source.json`
            as a SideStore source for tap-to-update.
          files: |
            mobile/ios/Solstice.ipa
            mobile/ios/sidestore-source.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # On a release tag, attach the IPA to that version's GitHub release (created by build.yml with
      # the Android APKs). Uses `gh release upload`, which only adds an asset and never changes the
      # release's draft/prerelease state, so the Android release pipeline is untouched. Best-effort:
      # the Android job finishes long before this ~15-min iOS build, but we still wait briefly for the
      # release to exist, and if it never appears we leave the IPA as a workflow artifact rather than
      # failing the build.
      - name: Attach IPA to the tagged release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        working-directory: mobile/ios
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          ASSETS=("Solstice-${{ steps.version.outputs.version }}.ipa")
          # Present only on a stable tag; this is what the public SideStore source URL resolves to.
          # Guarded with `if` rather than `&&`, since a false test would trip the shell's `set -e`.
          if [ -f stable/sidestore-source.json ]; then
            ASSETS+=(stable/sidestore-source.json)
          fi
          for i in $(seq 1 10); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "${ASSETS[@]}" --clobber
              echo "Attached ${ASSETS[*]} to release $TAG"
              exit 0
            fi
            echo "Release $TAG not ready yet ($i/10); waiting 30s..."
            sleep 30
          done
          echo "::warning::Release $TAG not found after waiting; IPA left as a workflow artifact only."
