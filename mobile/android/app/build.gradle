apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    compileSdk 35
    namespace 'net.f_list.fchat'

    defaultConfig {
        applicationId "net.f_list.fchat"
        minSdk 26
        targetSdk 35
        versionCode 54
        versionName "2026.9.0"
    }
    flavorDimensions "brand"
    productFlavors {
        solstice {
            dimension "brand"
            applicationId "net.f_list.solstice"
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        // A debug-signed build under its own application id, so a test build installs
        // beside the real one instead of replacing it (their signatures differ, so an
        // in-place update is refused and the only alternative would wipe the logs).
        candidate {
            initWith debug
            applicationIdSuffix ".candidate"
            versionNameSuffix "-candidate"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
}

// Copy webpack output to Android assets before every build
task copyWebAssets(type: Copy) {
    from '../../www'
    into 'src/main/assets/www'
}
preBuild.dependsOn copyWebAssets
