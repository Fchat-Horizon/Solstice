<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<!-- interactive-widget=resizes-content (iOS 17+): the soft keyboard shrinks the page viewport so
	     the height:100% layout sits above it, instead of overlaying the page and having WebKit
	     scroll the input into view (which slid the whole UI). On iOS 17+ the native keyboard resize
	     in WebViewController is disabled so the two don't fight. -->
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover, interactive-widget=resizes-content" />
	<title>Solstice</title>
	<style>html, body { touch-action: manipulation; }</style>
</head>
<body>
<div id="app">
</div>
<script type="text/javascript" src="chat.js"></script>
</body>
</html>
